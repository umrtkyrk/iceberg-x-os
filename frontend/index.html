<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iceberg X</title>
    <!--
      Dark theme before first paint, so a dark-theme user does not see a light
      flash on reload. Mirrors ThemeContext: same storage key, light by default,
      public pages (landing, login, shareable profiles, certificates) stay light.
    -->
    <script>
      (function () {
        if ('%VITE_DARK_THEME_ENABLED%' !== 'true') return;
        try {
          var pref = localStorage.getItem('ix-theme');
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var path = location.pathname;
          var isPublic = path === '/' || /^\/(login|verify|x|certificate|offboarding\/certificate|invite|case)(\/|$)/.test(path);
          if (dark && !isPublic) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Open Graph / Facebook Share Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://x.iceberg-digital.co.uk/" />
    <meta property="og:title" content="Iceberg X Portal" />
    <meta property="og:description" content="Iceberg X Student Portal - Track mission progress, coordinate with mentors, and grow your skills." />
    <meta property="og:image" content="https://x.iceberg-digital.co.uk/images/og-share-banner.jpg" />

    <!-- Twitter Share Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://x.iceberg-digital.co.uk/" />
    <meta name="twitter:title" content="Iceberg X Portal" />
    <meta name="twitter:description" content="Iceberg X Student Portal - Track mission progress, coordinate with mentors, and grow your skills." />
    <meta name="twitter:image" content="https://x.iceberg-digital.co.uk/images/og-share-banner.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
